<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>518 娱乐赛 · 名人堂</title>
  <style>
    /* ===== 全局重置 & 基础风格 ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-dark: #0a0c10;
      --gold: #f7d68d;
      --text-main: #e2e8f0;
      --text-muted: #7a8699;
      --border-line: rgba(255, 255, 255, 0.1);
      --card-unlocked-bg: #fdf5e6;
      --card-unlocked-border: #e6d5b3;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255, 255, 255, 0.02) 40px, rgba(255, 255, 255, 0.02) 41px),
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255, 255, 255, 0.02) 40px, rgba(255, 255, 255, 0.02) 41px);
    }

    .page-title {
      text-align: center;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 6px;
      color: var(--gold);
      margin-top: 24px;
      margin-bottom: 4px;
      text-shadow: 0 0 20px rgba(247, 214, 141, 0.4), 0 0 40px rgba(247, 214, 141, 0.2);
      z-index: 10;
      position: relative;
    }

    .showcase-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 20px 90px 20px;
      min-height: 0;
    }

    .showcase-frame {
      position: relative;
      width: 100%;
      max-width: 1000px;
      height: 100%;
      background: #0d1117;
      border: 1px solid #333;
      box-shadow: inset 0 30px 50px -20px rgba(255, 235, 180, 0.3), 0 20px 50px rgba(0, 0, 0, 0.8);
      border-radius: 12px;
      padding: 30px 24px 24px 24px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .showcase-frame::before {
      content: '';
      position: absolute;
      top: 0;
      left: 5%;
      right: 5%;
      height: 10px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
      border-radius: 50%;
      filter: blur(4px);
    }

    .page-view {
      display: none;
      width: 100%;
      height: 100%;
      min-height: 0;
      flex-direction: column;
    }

    .page-view.active {
      display: flex;
    }

    .grid-wall {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 16px;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 4px;
      padding-bottom: 20px;
      scrollbar-width: none;
      align-content: start;
    }

    .grid-wall::-webkit-scrollbar {
      display: none;
    }

    .slot {
      position: relative;
      aspect-ratio: 1 / 1;
      background: #080a0f;
      border: 1px solid #1f232b;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .slot.unlocked::before {
      content: '';
      position: absolute;
      top: -20%;
      left: 10%;
      right: 10%;
      height: 60%;
      background: radial-gradient(ellipse at top, rgba(255, 240, 200, 0.4), transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    .slot::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 40%, transparent 100%);
      z-index: 2;
      pointer-events: none;
    }

    .slot-icon {
      font-size: 48px;
      z-index: 1;
      transition: transform 0.2s;
      filter: drop-shadow(0 8px 8px rgba(0, 0, 0, 0.6));
      line-height: 1;
    }

    .slot.unlocked {
      background: var(--card-unlocked-bg);
      border-color: var(--card-unlocked-border);
      box-shadow: 0 0 15px rgba(253, 245, 230, 0.1);
    }

    .slot.unlocked:hover {
      transform: scale(1.05);
      z-index: 5;
      box-shadow: 0 0 25px rgba(255, 235, 180, 0.5);
      border-color: #f0e2c0;
    }

    .slot.locked {
      background: #14171e;
      border-color: #2a2e39;
    }

    .slot.locked .slot-icon {
      filter: grayscale(100%) opacity(0.1) blur(2px);
      color: #fff;
    }

    .slot.locked::before {
      content: '?';
      position: absolute;
      z-index: 1;
      font-size: 24px;
      color: rgba(255, 255, 255, 0.1);
      font-weight: bold;
    }

    .sponsor-wall {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 8px 4px 20px 4px;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sponsor-wall::-webkit-scrollbar {
      display: none;
    }

    .sponsor-section-title {
      font-size: 14px;
      letter-spacing: 3px;
      color: var(--gold);
      opacity: 0.85;
      padding-left: 4px;
      border-left: 3px solid var(--gold);
      line-height: 1.2;
    }

    .sponsor-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .sponsor-card {
      position: relative;
      background: #0f131a;
      border: 1px solid #2a2e39;
      border-radius: 10px;
      padding: 20px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      cursor: default;
    }

    .sponsor-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(247, 214, 141, 0.5), transparent);
    }

    .sponsor-card:hover {
      transform: translateY(-2px);
      border-color: rgba(247, 214, 141, 0.35);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(247, 214, 141, 0.08);
    }

    .sponsor-logo {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      background: radial-gradient(circle at 50% 30%, rgba(247, 214, 141, 0.18), transparent 70%);
      border: 1px solid rgba(247, 214, 141, 0.2);
      border-radius: 10px;
      line-height: 1;
    }

    .sponsor-info {
      flex: 1;
      min-width: 0;
    }

    .sponsor-name {
      font-size: 17px;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 1px;
      margin-bottom: 5px;
      text-shadow: 0 0 12px rgba(247, 214, 141, 0.25);
      word-break: break-word;
    }

    .sponsor-tag {
      display: inline-block;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1px;
      border: 1px solid #2f3542;
      background: rgba(255, 255, 255, 0.03);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .sponsor-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.5;
      word-break: break-word;
    }

    .hud-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(0deg, rgba(8, 10, 14, 0.95) 0%, transparent 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 10;
      pointer-events: none;
    }

    .nav-btn {
      pointer-events: auto;
      background: rgba(20, 24, 30, 0.8);
      border: 1px solid var(--border-line);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .nav-btn:hover {
      background: rgba(40, 46, 56, 0.9);
      border-color: rgba(247, 214, 141, 0.4);
      color: var(--gold);
    }

    .nav-btn.disabled {
      opacity: 0.25;
      pointer-events: none;
    }

    .nav-title {
      pointer-events: auto;
      background: rgba(20, 24, 30, 0.8);
      border: 1px solid var(--border-line);
      padding: 10px 40px;
      font-size: 15px;
      letter-spacing: 2px;
      color: var(--text-main);
      border-radius: 6px;
      min-width: 200px;
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
    }

    .modal.open {
      display: flex;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-box {
      width: 680px;
      max-width: 90vw;
      background: #0f131a;
      border: 1px solid #3a4152;
      border-radius: 10px;
      display: flex;
      position: relative;
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }

    .modal-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00ffaa, transparent);
    }

    .modal-left {
      width: 240px;
      background: #14171e;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-right: 1px solid #2a2e39;
      position: relative;
      flex-shrink: 0;
    }

    .modal-left::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255, 235, 180, 0.12), transparent 70%);
    }

    .modal-icon {
      font-size: 80px;
      filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.6));
      z-index: 1;
      line-height: 1;
    }

    .modal-right {
      flex: 1;
      padding: 30px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .modal-category {
      font-size: 12px;
      color: #00ffaa;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .modal-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--gold);
      word-break: break-word;
    }

    .modal-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 20px;
      flex: 1;
      word-break: break-word;
    }

    .modal-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      border-top: 1px solid #2a2e39;
      padding-top: 16px;
    }

    .info-item span {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .info-item b {
      font-size: 14px;
      color: #fff;
      font-weight: 500;
      word-break: break-word;
    }

    .info-item b#mWinner {
      color: var(--gold);
      font-weight: 700;
      text-shadow: 0 0 10px rgba(247, 214, 141, 0.3);
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 30px;
      height: 30px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #3a4152;
      border-radius: 50%;
      color: var(--text-muted);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .page-title {
        font-size: 26px;
        letter-spacing: 4px;
        margin-top: 16px;
        margin-bottom: 8px;
      }
      .showcase-container {
        padding: 10px 12px 80px 12px;
      }
      .showcase-frame {
        padding: 20px 12px 12px 12px;
      }
      .grid-wall {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .slot-icon {
        font-size: 32px;
      }
      .modal-box {
        flex-direction: column;
      }
      .modal-left {
        width: 100%;
        padding: 20px;
        border-right: none;
        border-bottom: 1px solid #2a2e39;
      }
      .modal-icon {
        font-size: 60px;
      }
      .modal-right {
        padding: 20px;
      }
      .modal-title {
        font-size: 20px;
      }
      .modal-info-grid {
        gap: 10px;
      }
      .sponsor-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .sponsor-card {
        padding: 16px 16px;
      }
      .nav-title {
        padding: 10px 20px;
        min-width: 150px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <h1 class="page-title">518娱乐赛名人堂</h1>

  <main class="showcase-container">
    <div class="showcase-frame">

      <div class="page-view active" id="pageHonor">
        <div class="grid-wall" id="gridWall"></div>
      </div>

      <div class="page-view" id="pageSponsor">
        <div class="sponsor-wall" id="sponsorWall"></div>
      </div>

    </div>
  </main>

  <footer class="hud-bottom">
    <div class="nav-btn" id="btnPrev" aria-label="上一页">&lt;</div>
    <div class="nav-title" id="navTitle">荣誉殿堂</div>
    <div class="nav-btn" id="btnNext" aria-label="下一页">&gt;</div>
  </footer>

  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-close" id="btnClose">✕</div>
      <div class="modal-left">
        <div class="modal-icon" id="mIcon">🏆</div>
      </div>
      <div class="modal-right">
        <div class="modal-category" id="mCategory">分类</div>
        <div class="modal-title" id="mTitle">成就名称</div>
        <div class="modal-desc" id="mDesc">成就描述...</div>
        <div class="modal-info-grid">
          <div class="info-item">
            <span>解锁时间</span>
            <b id="mDate">-</b>
          </div>
          <div class="info-item">
            <span>成就获得者</span>
            <b id="mWinner">-</b>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // 1. 成就数据
    // ============================================================
    const achievements = [
      {
        id: 1,
        title: "五子棋一战到底冠军",
        category: "当之无愧",
        date: "2026-10-22",
        winner: "Starstealers",
        icon: "⚫",
        unlocked: true,
        desc: "未尝一败，硬实力冠军"
      },
      {
        id: 2,
        title: "云顶之弈S1冠军",
        category: "FK怀抱",
        date: "2026-10-25",
        winner: "似你怀抱",
        icon: "🍄",
        unlocked: true,
        desc: "以三把牛蘑拿下冠军，赌狗王朝了"
      },
      {
        id: 3,
        title: "雀魂冠军",
        category: "后来居上",
        date: "2026-10-28",
        winner: "追着光梦游",
        icon: "🀄️",
        unlocked: true,
        desc: "决赛不软脚，冠军跑不了"
      },
      {
        id: 4,
        title: "海斗人头挑战赛冠军",
        category: "虚位以待",
        date: "2026-11-01",
        winner: "虚位以待",
        icon: "🔮",
        unlocked: true,
        desc: "极限操作与精准击杀的终极试炼，谁将夺魁？"
      },
      { id: 5, title: "神秘大奖 C", icon: "📦", unlocked: false },
      { id: 6, title: "神秘大奖 D", icon: "📦", unlocked: false },
      { id: 7, title: "神秘大奖 E", icon: "📦", unlocked: false },
      { id: 8, title: "神秘大奖 F", icon: "📦", unlocked: false },
      { id: 9, title: "神秘大奖 G", icon: "📦", unlocked: false },
      { id: 10, title: "神秘大奖 H", icon: "📦", unlocked: false },
      { id: 11, title: "神秘大奖 I", icon: "📦", unlocked: false },
      { id: 12, title: "神秘大奖 J", icon: "📦", unlocked: false },
      { id: 13, title: "神秘大奖 K", icon: "📦", unlocked: false },
      { id: 14, title: "神秘大奖 L", icon: "📦", unlocked: false },
      { id: 15, title: "神秘大奖 M", icon: "📦", unlocked: false },
      { id: 16, title: "神秘大奖 N", icon: "📦", unlocked: false },
      { id: 17, title: "神秘大奖 O", icon: "📦", unlocked: false },
      { id: 18, title: "神秘大奖 P", icon: "📦", unlocked: false }
    ];

    // ============================================================
    // 2. 赞助商数据（已修复第 5 个对象缺失的 {）
    // ============================================================
    const sponsors = [
      {
        name: "白银无敌土拨鼠战神",
        tag: "bin哥的雀魂粉丝",
        icon: "🗑️",
        desc: "为每位参赛选手赞助4.8元，woc，bin！"
      },
      {
        name: "吃兔子的大米",
        tag: "涨涨涨",
        icon: "🚀",
        desc: "希望你的股票一路长红"
      },
      {
        name: "愿归鸿",
        tag: "一神神了",
        icon: "☁️",
        desc: "经常给大家分享爱看的"
      },
      {
        name: "芝士一民",
        tag: "518的好大哥",
        icon: "🧀",
        desc: "518最有实力的LOL玩家"
      },
      {
        name: "黑名单",
        tag: "未被承认686的前任老公",
        icon: "🔫",
        desc: "我不会发言，只会当暖男"
      },
    ];

    // ============================================================
    // 3. DOM 元素
    // ============================================================
    const gridWall = document.getElementById('gridWall');
    const sponsorWall = document.getElementById('sponsorWall');
    const modal = document.getElementById('modal');

    const pageHonor = document.getElementById('pageHonor');
    const pageSponsor = document.getElementById('pageSponsor');
    const navTitle = document.getElementById('navTitle');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');

    // ============================================================
    // 4. 页面状态
    // ============================================================
    const PAGES = [
      { id: 'honor', title: '荣誉殿堂' },
      { id: 'sponsor', title: '赞助商名单' }
    ];
    let currentPage = 0;

    function switchPage(index) {
      if (index < 0 || index >= PAGES.length) return;
      currentPage = index;

      pageHonor.classList.toggle('active', PAGES[index].id === 'honor');
      pageSponsor.classList.toggle('active', PAGES[index].id === 'sponsor');

      navTitle.textContent = PAGES[index].title;

      btnPrev.classList.toggle('disabled', index === 0);
      btnNext.classList.toggle('disabled', index === PAGES.length - 1);
    }

    // ============================================================
    // 5. 渲染成就墙
    // ============================================================
    function renderWall() {
      gridWall.innerHTML = achievements.map(item => {
        const isUnlocked = item.unlocked;
        return `
          <div class="slot ${isUnlocked ? 'unlocked' : 'locked'}" data-id="${item.id}">
            <div class="slot-icon">${item.icon}</div>
          </div>
        `;
      }).join('');
    }

    // ============================================================
    // 6. 渲染赞助商列表
    // ============================================================
    function renderSponsors() {
      sponsorWall.innerHTML = `
        <div class="sponsor-section-title">感谢以下伙伴对518娱乐赛的大力支持</div>
        <div class="sponsor-grid">
          ${sponsors.map(s => `
            <div class="sponsor-card">
              <div class="sponsor-logo">${s.icon}</div>
              <div class="sponsor-info">
                <div class="sponsor-name">${s.name}</div>
                <span class="sponsor-tag">${s.tag}</span>
                <div class="sponsor-desc">${s.desc}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // ============================================================
    // 7. 点击交互
    // ============================================================
    gridWall.addEventListener('click', (e) => {
      const slot = e.target.closest('.slot');
      if (!slot) return;

      const id = Number(slot.dataset.id);
      const item = achievements.find(a => a.id === id);
      if (!item) return;

      if (item.unlocked) {
        openModal(item);
      } else {
        slot.style.transform = 'translateX(5px)';
        setTimeout(() => slot.style.transform = 'translateX(-5px)', 50);
        setTimeout(() => slot.style.transform = 'translateX(5px)', 100);
        setTimeout(() => slot.style.transform = 'translateX(0)', 150);
      }
    });

    // ============================================================
    // 8. 打开弹窗
    // ============================================================
    function openModal(item) {
      document.getElementById('mIcon').textContent = item.icon;
      document.getElementById('mCategory').textContent = item.category || '神秘成就';
      document.getElementById('mTitle').textContent = item.title;
      document.getElementById('mDesc').textContent = item.desc || '暂无描述，这是你荣誉的象征。';
      document.getElementById('mDate').textContent = item.date || '-';
      document.getElementById('mWinner').textContent = item.winner || '-';

      modal.classList.add('open');
    }

    // ============================================================
    // 9. 关闭弹窗
    // ============================================================
    document.getElementById('btnClose').addEventListener('click', () => {
      modal.classList.remove('open');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('open');
      }
    });

    // ============================================================
    // 10. 导航按钮事件
    // ============================================================
    btnPrev.addEventListener('click', () => switchPage(currentPage - 1));
    btnNext.addEventListener('click', () => switchPage(currentPage + 1));

    // ============================================================
    // 11. 初始化
    // ============================================================
    renderWall();
    renderSponsors();
    switchPage(0);
  </script>
</body>
</html>
