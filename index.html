<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>518 娱乐赛 · 名人堂</title>
  <style>
    /* ===== 全局重置 & 基础风格 ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    :root {
      --bg-dark: #0a0c10;
      --gold: #f7d68d;
      --gold-dim: #c9a96b;
      --text-main: #e2e8f0;
      --text-muted: #7a8699;
      --border-line: rgba(255, 255, 255, 0.1);
      --card-unlocked-bg: #fdf5e6;
      --card-unlocked-border: #e6d5b3;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255, 255, 255, 0.02) 40px, rgba(255, 255, 255, 0.02) 41px),
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255, 255, 255, 0.02) 40px, rgba(255, 255, 255, 0.02) 41px);
    }

    /* ===== 页面主标题 ===== */
    .page-title {
      text-align: center;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 8px;
      color: var(--gold);
      margin-top: 28px;
      margin-bottom: -6px;
      text-shadow: 0 0 20px rgba(247, 214, 141, 0.4), 0 0 40px rgba(247, 214, 141, 0.2);
      z-index: 10;
      position: relative;
    }

    /* ===== 核心展柜区域 ===== */
    .showcase-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 40px 80px 40px;
      perspective: 1000px;
      min-height: 0;
    }

    .showcase-frame {
      position: relative;
      width: 100%;
      max-width: 1400px;
      height: 100%;
      background: #0d1117;
      border: 1px solid #333;
      box-shadow: inset 0 30px 50px -20px rgba(255, 235, 180, 0.3), 0 20px 50px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
      padding: 40px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .showcase-frame::before {
      content: '';
      position: absolute;
      top: 0;
      left: 5%;
      right: 5%;
      height: 10px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
      border-radius: 50%;
      filter: blur(4px);
    }

    /* ===== 成就网格墙 ===== */
    .grid-wall {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 14px;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 10px;
      padding-bottom: 30px;
      scrollbar-width: none;
      align-content: start;
    }

    .grid-wall::-webkit-scrollbar {
      display: none;
    }

    /* ===== 单个展位（成就格子） ===== */
    .slot {
      position: relative;
      aspect-ratio: 1 / 1;
      background: #080a0f;
      border: 1px solid #1f232b;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    /* 已解锁的展位 — 金色底光 */
    .slot.unlocked::before {
      content: '';
      position: absolute;
      top: -20%;
      left: 10%;
      right: 10%;
      height: 60%;
      background: radial-gradient(ellipse at top, rgba(255, 240, 200, 0.4), transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    /* 高光折射 */
    .slot::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 40%, transparent 100%);
      z-index: 2;
      pointer-events: none;
    }

    .slot-icon {
      font-size: 48px;
      z-index: 1;
      transition: transform 0.3s;
      filter: drop-shadow(0 12px 12px rgba(0, 0, 0, 0.6));
      line-height: 1;
    }

    .slot.unlocked {
      background: var(--card-unlocked-bg);
      border-color: var(--card-unlocked-border);
      box-shadow: 0 0 15px rgba(253, 245, 230, 0.1);
    }

    .slot.unlocked .slot-icon {
      transform: translateY(-5px);
    }

    .slot.unlocked:hover {
      transform: scale(1.06);
      z-index: 5;
      box-shadow: 0 0 28px rgba(255, 235, 180, 0.5);
      border-color: #f0e2c0;
    }

    .slot.unlocked:hover .slot-icon {
      transform: translateY(-8px) scale(1.1);
    }

    /* 未解锁展位 — 灰暗神秘 */
    .slot.locked {
      background: #14171e;
      border-color: #2a2e39;
    }

    .slot.locked .slot-icon {
      filter: grayscale(100%) opacity(0.1) blur(2px);
      color: #fff;
    }

    .slot.locked::before {
      content: '?';
      position: absolute;
      z-index: 1;
      font-size: 20px;
      color: rgba(255, 255, 255, 0.1);
      font-weight: bold;
    }

    .slot.locked:hover {
      background: #1a1e26;
      border-color: #3a4152;
    }

    /* ===== 底部导航 HUD ===== */
    .hud-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(0deg, rgba(8, 10, 14, 0.95) 0%, transparent 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      z-index: 10;
      pointer-events: none;
    }

    .nav-btn {
      pointer-events: auto;
      background: rgba(20, 24, 30, 0.8);
      border: 1px solid var(--border-line);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
      border-radius: 4px;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .nav-title {
      pointer-events: auto;
      background: rgba(20, 24, 30, 0.8);
      border: 1px solid var(--border-line);
      padding: 10px 60px;
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--text-main);
      border-radius: 4px;
    }

    /* ===== 详情弹窗 ===== */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
    }

    .modal.open {
      display: flex;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-box {
      width: 720px;
      max-width: 92vw;
      background: #0f131a;
      border: 1px solid #3a4152;
      border-radius: 10px;
      display: flex;
      position: relative;
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }

    .modal-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00ffaa, transparent);
    }

    .modal-left {
      width: 280px;
      background: #14171e;
      padding: 40px 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-right: 1px solid #2a2e39;
      position: relative;
      flex-shrink: 0;
    }

    .modal-left::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at center, rgba(255, 235, 180, 0.12), transparent 70%);
    }

    .modal-icon {
      font-size: 100px;
      filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.6));
      z-index: 1;
      line-height: 1;
    }

    .modal-right {
      flex: 1;
      padding: 36px 32px 32px 32px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .modal-category {
      font-size: 12px;
      color: #00ffaa;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .modal-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 18px;
      color: var(--gold);
      word-break: break-word;
    }

    .modal-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 28px;
      flex: 1;
      word-break: break-word;
    }

    .modal-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      border-top: 1px solid #2a2e39;
      padding-top: 20px;
    }

    .info-item span {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .info-item b {
      font-size: 15px;
      color: #fff;
      font-weight: 500;
      word-break: break-word;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #3a4152;
      border-radius: 50%;
      color: var(--text-muted);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: 0.2s;
      z-index: 10;
      font-size: 16px;
      line-height: 1;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-color: #5a647a;
    }

    /* ===== 响应式小调整 ===== */
    @media (max-width: 640px) {
      .page-title {
        font-size: 28px;
        letter-spacing: 4px;
        margin-top: 18px;
      }
      .showcase-container {
        padding: 6px 12px 70px 12px;
      }
      .showcase-frame {
        padding: 24px 10px 10px 10px;
      }
      .grid-wall {
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 10px;
        padding: 6px;
      }
      .slot-icon {
        font-size: 32px;
      }
      .modal-box {
        flex-direction: column;
        width: 95vw;
      }
      .modal-left {
        width: 100%;
        padding: 24px;
        border-right: none;
        border-bottom: 1px solid #2a2e39;
      }
      .modal-icon {
        font-size: 64px;
      }
      .modal-right {
        padding: 24px;
      }
      .modal-title {
        font-size: 20px;
      }
      .nav-title {
        padding: 10px 30px;
      }
    }
  </style>
</head>
<body>

  <!-- ====== 顶部大标题 ====== -->
  <h1 class="page-title">518娱乐赛名人堂</h1>

  <!-- ====== 主展柜区域 ====== -->
  <main class="showcase-container">
    <div class="showcase-frame">
      <div class="grid-wall" id="gridWall"></div>
    </div>
  </main>

  <!-- ====== 底部装饰性导航 HUD ====== -->
  <footer class="hud-bottom">
    <div class="nav-btn" aria-hidden="true">&lt;</div>
    <div class="nav-title">荣誉殿堂</div>
    <div class="nav-btn" aria-hidden="true">&gt;</div>
  </footer>

  <!-- ====== 成就详情弹窗 ====== -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-close" id="btnClose">✕</div>
      <div class="modal-left">
        <div class="modal-icon" id="mIcon">🏆</div>
      </div>
      <div class="modal-right">
        <div class="modal-category" id="mCategory">分类</div>
        <div class="modal-title" id="mTitle">成就名称</div>
        <div class="modal-desc" id="mDesc">成就描述...</div>
        <div class="modal-info-grid">
          <div class="info-item">
            <span>解锁时间</span>
            <b id="mDate">-</b>
          </div>
          <div class="info-item">
            <span>成就获得者</span>
            <b id="mWinner">-</b>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // 1. 成就数据
    // ============================================================
    const achievements = [
      {
        id: 1,
        title: "五子棋一战到底冠军",
        category: "当之无愧",
        date: "2026-10-22",
        winner: "Starstealers",
        icon: "⚫",
        unlocked: true,
        desc: "未尝一败，硬实力冠军"
      },
      {
        id: 2,
        title: "云顶之弈S1冠军",
        category: "FK怀抱",
        date: "2026-10-25",
        winner: "似你怀抱",
        icon: "🍄",
        unlocked: true,
        desc: "以三把牛蘑拿下冠军，赌狗王朝了"
      },
      {
        id: 3,
        title: "雀魂冠军",
        category: "虚位以待",
        date: "2026-10-28",
        winner: "虚位以待",
        icon: "🀄️",
        unlocked: true,
        desc: "麻将桌上的巅峰对决，静候王者登顶。"
      },
      {
        id: 4,
        title: "海斗人头挑战赛冠军",
        category: "虚位以待",
        date: "2026-11-01",
        winner: "虚位以待",
        icon: "🔮",
        unlocked: true,
        desc: "极限操作与精准击杀的终极试炼，谁将夺魁？"
      },
      // 未解锁的占位卡片（灰显，不可点击查看详情）
      { id: 5, title: "神秘大奖 C", icon: "📦", unlocked: false },
      { id: 6, title: "神秘大奖 D", icon: "📦", unlocked: false },
      { id: 7, title: "神秘大奖 E", icon: "📦", unlocked: false },
      { id: 8, title: "神秘大奖 F", icon: "📦", unlocked: false },
      { id: 9, title: "神秘大奖 G", icon: "📦", unlocked: false },
      { id: 10, title: "神秘大奖 H", icon: "📦", unlocked: false },
      { id: 11, title: "神秘大奖 I", icon: "📦", unlocked: false },
      { id: 12, title: "神秘大奖 J", icon: "📦", unlocked: false },
      { id: 13, title: "神秘大奖 K", icon: "📦", unlocked: false },
      { id: 14, title: "神秘大奖 L", icon: "📦", unlocked: false },
      { id: 15, title: "神秘大奖 M", icon: "📦", unlocked: false },
      { id: 16, title: "神秘大奖 N", icon: "📦", unlocked: false },
      { id: 17, title: "神秘大奖 O", icon: "📦", unlocked: false },
      { id: 18, title: "神秘大奖 P", icon: "📦", unlocked: false }
    ];

    // ============================================================
    // 2. DOM 元素 & 渲染逻辑
    // ============================================================
    const gridWall = document.getElementById('gridWall');
    const modal = document.getElementById('modal');

    function renderWall() {
      gridWall.innerHTML = achievements.map(item => {
        const isUnlocked = item.unlocked;
        return `
          <div class="slot ${isUnlocked ? 'unlocked' : 'locked'}" data-id="${item.id}">
            <div class="slot-icon">${item.icon}</div>
          </div>
        `;
      }).join('');
    }

    // ============================================================
    // 3. 点击交互：已解锁 → 弹窗；未解锁 → 抖动
    // ============================================================
    gridWall.addEventListener('click', (e) => {
      const slot = e.target.closest('.slot');
      if (!slot) return;

      const id = Number(slot.dataset.id);
      const item = achievements.find(a => a.id === id);
      if (!item) return;

      if (item.unlocked) {
        openModal(item);
      } else {
        slot.style.transform = 'translateX(5px)';
        setTimeout(() => slot.style.transform = 'translateX(-5px)', 50);
        setTimeout(() => slot.style.transform = 'translateX(5px)', 100);
        setTimeout(() => slot.style.transform = 'translateX(0)', 150);
      }
    });

    // ============================================================
    // 4. 打开弹窗
    // ============================================================
    function openModal(item) {
      document.getElementById('mIcon').textContent = item.icon;
      document.getElementById('mCategory').textContent = item.category || '神秘成就';
      document.getElementById('mTitle').textContent = item.title;
      document.getElementById('mDesc').textContent = item.desc || '暂无描述，这是你荣誉的象征。';
      document.getElementById('mDate').textContent = item.date || '-';
      document.getElementById('mWinner').textContent = item.winner || '-';

      modal.classList.add('open');
    }

    // ============================================================
    // 5. 关闭弹窗
    // ============================================================
    document.getElementById('btnClose').addEventListener('click', () => {
      modal.classList.remove('open');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('open');
      }
    });

    // ============================================================
    // 6. 初始化
    // ============================================================
    renderWall();
  </script>
</body>
</html>
