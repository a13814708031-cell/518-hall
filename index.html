<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>518娱乐赛名人堂</title>
<style>
  :root {
    --bg-dark: #0a0c10;
    --gold: #f7d68d;
    --text-main: #e2e8f0;
    --text-muted: #7a8699;
    --border-line: rgba(255, 255, 255, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background-image: 
      linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
      repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.02) 40px, rgba(255,255,255,0.02) 41px),
      repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.02) 40px, rgba(255,255,255,0.02) 41px);
  }

  /* ====== 新增的页面大标题 ====== */
  .page-title {
    text-align: center;
    font-size: 42px; /* 字体加大 */
    font-weight: 900; /* 字体加粗 */
    letter-spacing: 8px; /* 字间距拉开，更有气势 */
    color: var(--gold);
    margin-top: 30px;
    margin-bottom: -10px;
    text-shadow: 0 0 20px rgba(247, 214, 141, 0.4), 0 0 40px rgba(247, 214, 141, 0.2); /* 发光效果 */
    z-index: 10;
  }

  /* ====== 核心展柜区域 ====== */
  .showcase-container {
    flex: 1; display: flex; justify-content: center; align-items: center;
    padding: 10px 40px 80px 40px; /* 顶部 padding 减小，给标题留空间 */
    perspective: 1000px;
  }

  .showcase-frame {
    position: relative; width: 100%; max-width: 1400px; height: 100%;
    background: #0d1117; border: 1px solid #333;
    box-shadow: inset 0 30px 50px -20px rgba(255,235,180,0.3), 0 20px 50px rgba(0,0,0,0.8);
    border-radius: 8px; padding: 40px 20px 20px 20px;
    display: flex; flex-direction: column;
  }
  
  .showcase-frame::before {
    content: ''; position: absolute; top: 0; left: 5%; right: 5%; height: 10px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
    border-radius: 50%; filter: blur(4px);
  }

  .grid-wall {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 12px; width: 100%; height: 100%;
    overflow-y: auto; padding: 10px; padding-bottom: 30px;
    scrollbar-width: none;
  }
  .grid-wall::-webkit-scrollbar { display: none; }

  .slot {
    position: relative; aspect-ratio: 1;
    background: #080a0f; border: 1px solid #1f232b;
    border-radius: 4px; display: flex; justify-content: center; align-items: center;
    cursor: pointer; transition: all 0.3s;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    overflow: hidden;
  }

  .slot.unlocked::before {
    content: ''; position: absolute; top: -20%; left: 10%; right: 10%; height: 60%;
    background: radial-gradient(ellipse at top, rgba(255, 240, 200, 0.4), transparent 70%);
    z-index: 0; pointer-events: none;
  }

  .slot::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 40%, transparent 100%);
    z-index: 2; pointer-events: none;
  }

  .slot-icon {
    font-size: 48px; 
    z-index: 1;
    transition: transform 0.3s;
    filter: drop-shadow(0 12px 12px rgba(0,0,0,0.6));
  }

  .slot.unlocked .slot-icon::after {
    content: ''; position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 6px; background: rgba(0,0,0,0.4); border-radius: 50%;
    filter: blur(2px);
  }

  .slot.unlocked {
    background: #fdf5e6;
    border-color: #e6d5b3;
    box-shadow: 0 0 15px rgba(253, 245, 230, 0.1);
  }
  .slot.unlocked .slot-icon { transform: translateY(-5px); }
  .slot.unlocked:hover { transform: scale(1.05); z-index: 5; box-shadow: 0 0 25px rgba(255,235,180,0.4); }
  .slot.unlocked:hover .slot-icon { transform: translateY(-8px) scale(1.1); }

  .slot.locked {
    background: #14171e;
    border-color: #2a2e39;
  }
  .slot.locked .slot-icon {
    filter: grayscale(100%) opacity(0.1) blur(2px);
    color: #fff;
  }
  .slot.locked::before {
    content: '?'; position: absolute; z-index: 1;
    font-size: 20px; color: rgba(255,255,255,0.1); font-weight: bold;
  }
  .slot.locked:hover { background: #1a1e26; border-color: #3a4152; }

  /* ====== 底部导航 HUD ====== */
  .hud-bottom {
    position: fixed; bottom: 0; left: 0; right: 0; height: 80px;
    background: linear-gradient(0deg, rgba(8,10,14,0.95) 0%, transparent 100%);
    display: flex; justify-content: center; align-items: center; gap: 20px;
    z-index: 10; pointer-events: none;
  }
  .nav-btn {
    pointer-events: auto;
    background: rgba(20,24,30,0.8); border: 1px solid var(--border-line);
    color: var(--text-main); width: 40px; height: 40px;
    display: flex; justify-content: center; align-items: center;
    font-size: 20px; cursor: pointer; transition: 0.2s; border-radius: 4px;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.1); }
  .nav-title {
    pointer-events: auto;
    background: rgba(20,24,30,0.8); border: 1px solid var(--border-line);
    padding: 10px 60px; font-size: 14px; letter-spacing: 2px;
    color: var(--text-main); border-radius: 4px;
  }

  /* ====== 详情弹窗 ====== */
  .modal {
    position: fixed; inset: 0; z-index: 100;
    display: none; justify-content: center; align-items: center;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
  }
  .modal.open { display: flex; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-box {
    width: 700px; background: #0f131a;
    border: 1px solid #3a4152; border-radius: 8px;
    display: flex; position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    overflow: hidden;
  }
  .modal-box::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, #00ffaa, transparent);
  }

  .modal-left {
    width: 300px; background: #14171e; padding: 40px;
    display: flex; justify-content: center; align-items: center;
    border-right: 1px solid #2a2e39; position: relative;
  }
  .modal-left::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at center, rgba(255,235,180,0.1), transparent 70%);
  }
  .modal-icon { font-size: 100px; filter: drop-shadow(0 15px 20px rgba(0,0,0,0.6)); z-index: 1; }

  .modal-right { flex: 1; padding: 40px; display: flex; flex-direction: column; }
  .modal-category { font-size: 12px; color: #00ffaa; letter-spacing: 2px; margin-bottom: 10px; }
  .modal-title { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: var(--gold); }
  .modal-desc { font-size: 14px; color: var(--text-muted); line-height: 1.8; margin-bottom: 30px; flex: 1; }
  
  .modal-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; border-top: 1px solid #2a2e39; padding-top: 20px; }
  .info-item span { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .info-item b { font-size: 14px; color: #fff; font-weight: normal; }

  .modal-close {
    position: absolute; top: 20px; right: 20px; width: 30px; height: 30px;
    background: rgba(255,255,255,0.05); border: 1px solid #3a4152; border-radius: 50%;
    color: var(--text-muted); display: flex; justify-content: center; align-items: center;
    cursor: pointer; transition: 0.2s; z-index: 10;
  }
  .modal-close:hover { background: rgba(255,255,255,0.1); color: #fff; }

</style>
</head>
<body>

  <!-- 新增的大标题 -->
  <h1 class="page-title">518娱乐赛名人堂</h1>

  <main class="showcase-container">
    <div class="showcase-frame">
      <div class="grid-wall" id="gridWall"></div>
    </div>
  </main>

  <footer class="hud-bottom">
    <div class="nav-btn">&lt;</div>
    <div class="nav-title">1</div>
    <div class="nav-btn">&gt;</div>
  </footer>

  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-close" id="btnClose">✕</div>
      <div class="modal-left">
        <div class="modal-icon" id="mIcon">🏆</div>
      </div>
      <div class="modal-right">
        <div class="modal-category" id="mCategory">分类</div>
        <div class="modal-title" id="mTitle">成就名称</div>
        <div class="modal-desc" id="mDesc">成就描述...</div>
        <div class="modal-info-grid">
          <div class="info-item">
            <span>解锁时间</span>
            <b id="mDate">-</b>
          </div>
          <div class="info-item">
            <span>成就获得者</span>
            <b id="mWinner">-</b>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/* ============================================================
   1. 数据区
   ============================================================ */
const achievements = [
  // 已解锁的
  { 
    id: 1, 
    title: "五子棋一战到底冠军", 
    category: "当之无愧", 
    date: "2026-10-22", 
    winner: "Starstealers", 
    icon: "⚫", 
    unlocked: true, 
    desc: "未尝一败，硬实力冠军" 
  },
  { 
    id: 2, 
    title: "云顶之弈S1冠军", 
    category: "FK怀抱", 
    date: "2026-10-25", 
    winner: "似你怀抱", 
    icon: "🍄", 
    unlocked: true, 
    desc: "以三把牛蘑拿下冠军，赌狗王朝了" 
  },
  
  // 未解锁的（占位展示，自动灰显）
  { id: 3, title: "神秘大奖 A", icon: "📦", unlocked: false },
  { id: 4, title: "神秘大奖 B", icon: "📦", unlocked: false },
  { id: 5, title: "神秘大奖 C", icon: "📦", unlocked: false },
  { id: 6, title: "神秘大奖 D", icon: "📦", unlocked: false },
  { id: 7, title: "神秘大奖 E", icon: "📦", unlocked: false },
  { id: 8, title: "神秘大奖 F", icon: "📦", unlocked: false },
  { id: 9, title: "神秘大奖 G", icon: "📦", unlocked: false },
  { id: 10, title: "神秘大奖 H", icon: "📦", unlocked: false },
  { id: 11, title: "神秘大奖 I", icon: "📦", unlocked: false },
  { id: 12, title: "神秘大奖 J", icon: "📦", unlocked: false },
  { id: 13, title: "神秘大奖 K", icon: "📦", unlocked: false },
  { id: 14, title: "神秘大奖 L", icon: "📦", unlocked: false },
  { id: 15, title: "神秘大奖 M", icon: "📦", unlocked: false },
  { id: 16, title: "神秘大奖 N", icon: "📦", unlocked: false },
  { id: 17, title: "神秘大奖 O", icon: "📦", unlocked: false },
  { id: 18, title: "神秘大奖 P", icon: "📦", unlocked: false },
];

/* ============================================================
   2. 渲染与交互逻辑
   ============================================================ */
const gridWall = document.getElementById('gridWall');
const modal = document.getElementById('modal');

function renderWall() {
  gridWall.innerHTML = achievements.map(item => `
    <div class="slot ${item.unlocked ? 'unlocked' : 'locked'}" data-id="${item.id}">
      <div class="slot-icon">${item.icon}</div>
    </div>
  `).join('');
}

gridWall.addEventListener('click', (e) => {
  const slot = e.target.closest('.slot');
  if (!slot) return;

  const id = Number(slot.dataset.id);
  const item = achievements.find(a => a.id === id);

  if (item.unlocked) {
    openModal(item);
  } else {
    slot.style.transform = 'translateX(5px)';
    setTimeout(() => slot.style.transform = 'translateX(-5px)', 50);
    setTimeout(() => slot.style.transform = 'translateX(5px)', 100);
    setTimeout(() => slot.style.transform = 'translateX(0)', 150);
  }
});

function openModal(item) {
  document.getElementById('mIcon').textContent = item.icon;
  document.getElementById('mCategory').textContent = item.category || '神秘成就';
  document.getElementById('mTitle').textContent = item.title;
  document.getElementById('mDesc').textContent = item.desc || '暂无描述，这是你荣誉的象征。';
  document.getElementById('mDate').textContent = item.date || '-';
  document.getElementById('mWinner').textContent = item.winner || '-';
  
  modal.classList.add('open');
}

document.getElementById('btnClose').addEventListener('click', () => {
  modal.classList.remove('open');
});
modal.addEventListener('click', (e) => {
  if (e.target === modal) modal.classList.remove('open');
});

renderWall();
</script>
</body>
</html>
